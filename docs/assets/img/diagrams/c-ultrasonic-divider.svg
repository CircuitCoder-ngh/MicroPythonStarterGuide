<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" font-family="Inter, Arial, sans-serif" font-size="15">
  <rect x="2" y="2" width="416" height="256" rx="14" fill="#ffffff" stroke="#d5dbe3" stroke-width="2"/>
  <rect x="20" y="60" width="96" height="40" rx="6" fill="#2f7bff"/>
  <text x="68" y="86" text-anchor="middle" font-weight="700" fill="#fff">ECHO</text>
  <text x="68" y="120" text-anchor="middle" fill="#5b6572" font-size="13">(5 V signal)</text>
  <g stroke="#1b2430" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="116" y1="80" x2="150" y2="80"/>
    <!-- 1k resistor horizontal -->
    <rect x="150" y="66" width="64" height="28" rx="4" fill="#f1e7c8"/>
    <line x1="168" y1="66" x2="168" y2="94" stroke="#a0522d" stroke-width="4"/>
    <line x1="180" y1="66" x2="180" y2="94" stroke="#111" stroke-width="4"/>
    <line x1="192" y1="66" x2="192" y2="94" stroke="#c0392b" stroke-width="4"/>
    <line x1="214" y1="80" x2="300" y2="80"/>
    <!-- down to 2k -->
    <line x1="250" y1="80" x2="250" y2="130"/>
    <rect x="236" y="130" width="28" height="64" rx="4" fill="#f1e7c8"/>
    <line x1="236" y1="148" x2="264" y2="148" stroke="#c0392b" stroke-width="4"/>
    <line x1="236" y1="160" x2="264" y2="160" stroke="#111" stroke-width="4"/>
    <line x1="236" y1="172" x2="264" y2="172" stroke="#c0392b" stroke-width="4"/>
    <line x1="250" y1="194" x2="250" y2="214"/>
    <line x1="228" y1="216" x2="272" y2="216"/>
    <line x1="236" y1="223" x2="264" y2="223"/>
  </g>
  <circle cx="250" cy="80" r="6" fill="#1b2430"/>
  <text x="182" y="56" text-anchor="middle" fill="#1b2430">1 kΩ</text>
  <text x="274" y="166" fill="#1b2430">2 kΩ</text>
  <text x="250" y="246" text-anchor="middle" font-weight="700" fill="#1b2430">GND</text>
  <rect x="300" y="64" width="104" height="32" rx="6" fill="#1a8fe6"/>
  <text x="352" y="85" text-anchor="middle" font-weight="700" fill="#fff">GPIO 39</text>
  <text x="352" y="118" text-anchor="middle" fill="#5b6572" font-size="13">(sees about 3.3 V)</text>
</svg>
