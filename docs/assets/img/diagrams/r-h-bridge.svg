<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1a8fe6"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e8730c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="330" rx="16" fill="#ffffff"/>

  <!-- ============ Panel 1: forwards ============ -->
  <g transform="translate(20,0)">
    <text x="150" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0e1116">Forwards</text>
    <!-- rails -->
    <line x1="40" y1="60" x2="260" y2="60" stroke="#d62828" stroke-width="4"/>
    <text x="150" y="53" text-anchor="middle" font-size="13" fill="#d62828">+ battery</text>
    <line x1="40" y1="260" x2="260" y2="260" stroke="#333" stroke-width="4"/>
    <text x="150" y="284" text-anchor="middle" font-size="13" fill="#333">GND</text>
    <!-- left column wires -->
    <line x1="60" y1="60" x2="60" y2="95" stroke="#333" stroke-width="3"/>
    <line x1="60" y1="125" x2="60" y2="195" stroke="#333" stroke-width="3"/>
    <line x1="60" y1="225" x2="60" y2="260" stroke="#333" stroke-width="3"/>
    <!-- right column wires -->
    <line x1="240" y1="60" x2="240" y2="95" stroke="#333" stroke-width="3"/>
    <line x1="240" y1="125" x2="240" y2="195" stroke="#333" stroke-width="3"/>
    <line x1="240" y1="225" x2="240" y2="260" stroke="#333" stroke-width="3"/>
    <!-- switches: S1 top-left CLOSED, S2 top-right open, S3 bottom-left open, S4 bottom-right CLOSED -->
    <line x1="60" y1="95" x2="60" y2="125" stroke="#333" stroke-width="3"/>
    <line x1="240" y1="95" x2="262" y2="120" stroke="#999" stroke-width="3"/>
    <line x1="60" y1="195" x2="82" y2="220" stroke="#999" stroke-width="3"/>
    <line x1="240" y1="195" x2="240" y2="225" stroke="#333" stroke-width="3"/>
    <g font-size="12" fill="#555">
      <text x="30" y="115">S1</text><text x="268" y="115">S2</text>
      <text x="30" y="215">S3</text><text x="268" y="215">S4</text>
    </g>
    <g fill="#0e1116"><circle cx="60" cy="95" r="4.5"/><circle cx="60" cy="125" r="4.5"/><circle cx="60" cy="195" r="4.5"/><circle cx="60" cy="225" r="4.5"/><circle cx="240" cy="95" r="4.5"/><circle cx="240" cy="125" r="4.5"/><circle cx="240" cy="195" r="4.5"/><circle cx="240" cy="225" r="4.5"/></g>
    <!-- motor -->
    <line x1="60" y1="160" x2="122" y2="160" stroke="#333" stroke-width="3"/>
    <line x1="178" y1="160" x2="240" y2="160" stroke="#333" stroke-width="3"/>
    <circle cx="150" cy="160" r="28" fill="#fff4cc" stroke="#0e1116" stroke-width="3"/>
    <text x="150" y="167" text-anchor="middle" font-size="20" font-weight="700" fill="#0e1116">M</text>
    <!-- current path -->
    <path d="M48 64 V150 H112" fill="none" stroke="#1a8fe6" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrowBlue)" opacity="0.9"/>
    <path d="M188 150 H252 V255" fill="none" stroke="#1a8fe6" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrowBlue)" opacity="0.9"/>
    <text x="150" y="312" text-anchor="middle" font-size="14" fill="#0e1116">S1 + S4 closed: current flows left → right</text>
  </g>

  <!-- ============ Panel 2: backwards ============ -->
  <g transform="translate(330,0)">
    <text x="150" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0e1116">Backwards</text>
    <line x1="40" y1="60" x2="260" y2="60" stroke="#d62828" stroke-width="4"/>
    <text x="150" y="53" text-anchor="middle" font-size="13" fill="#d62828">+ battery</text>
    <line x1="40" y1="260" x2="260" y2="260" stroke="#333" stroke-width="4"/>
    <text x="150" y="284" text-anchor="middle" font-size="13" fill="#333">GND</text>
    <line x1="60" y1="60" x2="60" y2="95" stroke="#333" stroke-width="3"/>
    <line x1="60" y1="125" x2="60" y2="195" stroke="#333" stroke-width="3"/>
    <line x1="60" y1="225" x2="60" y2="260" stroke="#333" stroke-width="3"/>
    <line x1="240" y1="60" x2="240" y2="95" stroke="#333" stroke-width="3"/>
    <line x1="240" y1="125" x2="240" y2="195" stroke="#333" stroke-width="3"/>
    <line x1="240" y1="225" x2="240" y2="260" stroke="#333" stroke-width="3"/>
    <!-- S1 open, S2 CLOSED, S3 CLOSED, S4 open -->
    <line x1="60" y1="95" x2="82" y2="120" stroke="#999" stroke-width="3"/>
    <line x1="240" y1="95" x2="240" y2="125" stroke="#333" stroke-width="3"/>
    <line x1="60" y1="195" x2="60" y2="225" stroke="#333" stroke-width="3"/>
    <line x1="240" y1="195" x2="262" y2="220" stroke="#999" stroke-width="3"/>
    <g font-size="12" fill="#555">
      <text x="30" y="115">S1</text><text x="268" y="115">S2</text>
      <text x="30" y="215">S3</text><text x="268" y="215">S4</text>
    </g>
    <g fill="#0e1116"><circle cx="60" cy="95" r="4.5"/><circle cx="60" cy="125" r="4.5"/><circle cx="60" cy="195" r="4.5"/><circle cx="60" cy="225" r="4.5"/><circle cx="240" cy="95" r="4.5"/><circle cx="240" cy="125" r="4.5"/><circle cx="240" cy="195" r="4.5"/><circle cx="240" cy="225" r="4.5"/></g>
    <line x1="60" y1="160" x2="122" y2="160" stroke="#333" stroke-width="3"/>
    <line x1="178" y1="160" x2="240" y2="160" stroke="#333" stroke-width="3"/>
    <circle cx="150" cy="160" r="28" fill="#fff4cc" stroke="#0e1116" stroke-width="3"/>
    <text x="150" y="167" text-anchor="middle" font-size="20" font-weight="700" fill="#0e1116">M</text>
    <path d="M252 64 V150 H188" fill="none" stroke="#e8730c" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrowOrange)" opacity="0.9"/>
    <path d="M112 150 H48 V255" fill="none" stroke="#e8730c" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrowOrange)" opacity="0.9"/>
    <text x="150" y="312" text-anchor="middle" font-size="14" fill="#0e1116">S2 + S3 closed: current flows right → left</text>
  </g>
</svg>
